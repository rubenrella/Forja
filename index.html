<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Forja — Entrenamiento</title>
<meta name="description" content="Diario de entrenamiento personal: ejercicios por grupo muscular, calendario, progresión y suplementos.">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Colores como variables: el editor reducido (Ctrl+E → Colores) las detecta. */
:root{--color-principal:#b6ff3b;--color-acento:#22d3ee;--color-fondo:#0a0c10;--color-tarjeta:#151922;--color-texto:#eef1f7;--color-borde:#262c3a;
--muted:#8b93a7;--card2:#1c2230;--danger:#ff5d73;--ok:#34d399;--r:18px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--color-fondo);color:var(--color-texto);overscroll-behavior:none}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 16px calc(96px + var(--sab));display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.hdr .sub{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
.hdr h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--color-tarjeta);border:1px solid var(--color-borde);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--color-borde);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--color-principal);color:#0a0c10;border-color:transparent}
.btn.blk{display:flex;width:100%}
.btn.danger{color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--color-borde);font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--color-borde);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--cc,var(--color-principal));color:#0a0c10;border-color:transparent}
.scroll-x{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--sab));background:rgba(15,18,25,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--color-borde);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;padding:4px 0}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--color-principal)}
/* week strip */
.week{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.week .nav{width:26px;color:var(--muted);font-size:22px;text-align:center}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:16px;background:var(--color-tarjeta);border:1px solid var(--color-borde)}
.wd .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.wd .n{font-size:17px;font-weight:800}
.wd .dots{display:flex;gap:2px;height:6px}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wd.today .n{color:var(--color-principal)}
.wd.sel{background:var(--color-principal);border-color:transparent;color:#0a0c10}
.wd.sel .l{color:#0a0c10aa}.wd.sel .n{color:#0a0c10}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--color-tarjeta);border:1px solid var(--color-borde);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
/* types */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--card2);border:1px solid var(--color-borde);font-size:11.5px;font-weight:700}
.type .e{display:inline-flex;color:var(--c)}.supp .e{display:inline-flex;color:var(--color-texto);opacity:.85}.supp.on .e{color:var(--ok);opacity:1}.ic{flex:none}
.type.on{background:color-mix(in srgb,var(--c) 22%,var(--color-tarjeta));border-color:var(--c);color:var(--c)}
.field{display:flex;gap:8px}
.field label{flex:1;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,input:not([type]){width:100%;background:var(--card2);border:1px solid var(--color-borde);color:var(--color-texto);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--color-principal)}
textarea{resize:none;min-height:70px}
/* supplements */
.supps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.supp{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--color-borde);font-weight:600;font-size:13.5px;line-height:1.15;text-align:left}

.supp .tick{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #3a4258;display:grid;place-items:center;font-size:13px;color:transparent}
.supp.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--color-tarjeta))}
.supp.on .tick{background:var(--ok);border-color:var(--ok);color:#06241a}
/* exercise card */
.ex{padding:0;overflow:hidden}
.ex-h{display:flex;gap:12px;align-items:center;padding:12px}
.ex-h .fig{width:96px;height:80px;border-radius:14px;flex:none}
.ex-h h3{font-size:16.5px;font-weight:800;line-height:1.2}
.ex-h .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex .last{font-size:12px;color:var(--color-acento);font-weight:600;margin-top:3px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ok);color:#06241a}
.sets{padding:0 12px 12px}
.set,.sethd{display:grid;grid-template-columns:30px 1fr 18px 1fr 46px;gap:8px;align-items:center;margin-top:7px}
.sethd{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;text-align:center;margin-top:0}
.set .n{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.set input{text-align:center;font-weight:800;font-size:18px;padding:9px 4px}
.set .x{text-align:center;color:var(--muted)}
.ck{height:42px;border-radius:12px;background:var(--card2);border:2px solid #343c52;display:grid;place-items:center;color:transparent;font-size:20px;font-weight:900}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:#06241a}
.set.done input{color:var(--ok)}
.set.pr .n{background:#ffcf33;color:#3a2a00}
.ex-f{display:flex;gap:8px;padding:0 12px 12px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--color-principal) calc(var(--p)*1%),#2a3144 0);display:grid;place-items:center;flex:none}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--color-tarjeta);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;font-size:17px;color:var(--color-texto);margin-bottom:4px}
/* library */
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px;background:var(--color-tarjeta)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.gtile{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:18px;background:var(--color-tarjeta);border:2px solid var(--color-borde);font-size:12.5px;font-weight:700}
.gtile svg{width:46px;height:70px}
.gtile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--color-tarjeta));color:var(--c)}
.lib{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--color-tarjeta);border:1px solid var(--color-borde);margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:92px;position:relative}
.lib .fig{width:112px;height:96px;border-radius:14px;flex:none}
.lib h3{font-size:16px;font-weight:800;line-height:1.2}
.lib .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.lib .sel{width:26px;height:26px;border-radius:50%;border:2px solid #3a4258;display:grid;place-items:center;color:transparent;flex:none;font-size:14px}
.lib.picked{border-color:var(--color-principal)}
.lib.picked .sel{background:var(--color-principal);border-color:var(--color-principal);color:#0a0c10}
.star{color:#4a536a;font-size:22px;padding:4px}.star.on{color:#ffcf33}
.fig{background:radial-gradient(110% 90% at 50% 25%,#3a3e46,#15171b 70%,#0b0c0e);overflow:hidden;position:relative}
.fig svg{display:block;width:100%;height:100%}
.fig .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#0008;color:var(--gc)}
.pickbar{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sab));z-index:25;background:var(--color-principal);color:#0a0c10;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:0 10px 30px #000a}
/* sheet */
.ov{position:fixed;inset:0;background:#000a;z-index:40;display:none;animation:fade .2s}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--color-fondo);border-radius:26px 26px 0 0;border:1px solid var(--color-borde);z-index:41;padding:10px 16px calc(24px + var(--sab));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#3a4258;margin:2px auto 12px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:10px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--color-principal)}
.tip{background:color-mix(in srgb,var(--color-acento) 12%,var(--color-tarjeta));border:1px solid color-mix(in srgb,var(--color-acento) 40%,transparent);border-radius:14px;padding:11px 13px;font-size:14px;margin-top:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cd{aspect-ratio:1/1.12;border-radius:12px;background:var(--color-tarjeta);border:1px solid var(--color-borde);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0 5px;font-weight:700;font-size:14px;position:relative}
.cd.out{opacity:.28}
.cd.today{border-color:var(--color-principal)}
.cd.sel{background:var(--color-principal);color:#0a0c10;border-color:transparent}
.cd .dots{display:flex;gap:2px;height:6px}
.cd .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cd.sel .dots i{box-shadow:0 0 0 1.5px #0a0c10}
.cd .sp{position:absolute;right:4px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cd .rest{font-size:12px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
/* progress */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.bars b{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--color-principal),color-mix(in srgb,var(--color-principal) 40%,#0000));min-height:3px}
.bars span{font-size:10.5px;color:var(--muted);font-weight:700}
.pbar{height:8px;border-radius:5px;background:#2a3144;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c,var(--color-principal));border-radius:5px}
.rec{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-borde)}.rec:last-child{border:0}
select{width:100%;background:var(--card2);color:var(--color-texto);border:1px solid var(--color-borde);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}.seg button.on{background:var(--color-principal);color:#0a0c10}
.switch{position:relative;width:50px;height:30px;border-radius:15px;background:#343c52;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(20px)}
/* rest timer + toast */
.rest-pill{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sab));z-index:26;background:#10141c;border:1px solid var(--color-acento);border-radius:20px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px #000b}
.rest-pill.on{display:flex}
.rest-pill .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--color-acento);min-width:78px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-140%);background:#1f2636;border:1px solid var(--color-borde);padding:11px 18px;border-radius:16px;font-weight:700;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.2,1);max-width:92%;text-align:center;box-shadow:0 10px 30px #000a}
.toast.on{transform:translate(-50%,0)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.install{background:linear-gradient(135deg,color-mix(in srgb,var(--color-principal) 20%,var(--color-tarjeta)),var(--color-tarjeta))}
@media (min-width:700px){.view{max-width:640px;margin:0 auto;width:100%}}
</style>
</head>
<body>

  <main class="view" id="v-hoy"></main>

</div>

*{box-sizing:border-box}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;background:#14181c;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

const FigMgr={items:new Map(),vis:new Set(),raf:0,io:null,
  mount(host,ex,o){const f=makeFig(host,ex,o);this.items.set(host,f);if(!this.io)this.io=new IntersectionObserver(es=>{for(const e of es){e.isIntersecting?this.vis.add(e.target):this.vis.delete(e.target)}this.kick()},{rootMargin:'40px'});this.io.observe(host);return f},
  clear(){if(this.io)for(const h of this.items.keys())this.io.unobserve(h);this.items.clear();this.vis.clear()},
  kick(){if(!this.raf&&this.vis.size)this.raf=requestAnimationFrame(t=>this.tick(t))},
  tick(t){this.raf=0;if(document.hidden||!this.vis.size)return;
    if(!this.last||t-this.last>30){this.last=t;for(const h of this.vis){const f=this.items.get(h);if(f&&h.isConnected)f.update(t)}}
    this.raf=requestAnimationFrame(t2=>this.tick(t2))}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)FigMgr.kick()});

const ICON={hoy:'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',lib:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',prog:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',mas:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'};
const TABS=[['hoy','Hoy'],['cal','Calendario'],['lib','Ejercicios'],['prog','Progreso'],['mas','Ajustes']];

/* ── gráficos ── */
function lineChart(pts,col,unit){
  if(pts.length<2)return'<div class="hint" style="padding:18px 4px">Registra al menos 2 sesiones para ver la curva de progresión.</div>';
  const W=320,H=150,p=26,ys=pts.map(q=>q.y),lo=Math.min(...ys),hi=Math.max(...ys),sp=(hi-lo)||1;
  const X=i=>p+(W-2*p)*i/(pts.length-1),Y=y=>H-26-(H-52)*(y-lo)/sp;
  const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L${X(pts.length-1)} ${H-26} L${X(0)} ${H-26}Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((q,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="${i===pts.length-1?5:3.2}" fill="${i===pts.length-1?col:'#0a0c10'}" stroke="${col}" stroke-width="2"/>`).join('')}
  <text x="${p}" y="${H-6}" fill="#8b93a7" font-size="10" font-weight="700">${fshort(pts[0].d)}</text><text x="${W-p}" y="${H-6}" fill="#8b93a7" font-size="10" font-weight="700" text-anchor="end">${fshort(pts[pts.length-1].d)}</text>
  <text x="${p}" y="12" fill="#8b93a7" font-size="10" font-weight="700">${hi.toFixed(1).replace('.0','')} ${unit}</text><text x="${W-p}" y="12" fill="${col}" font-size="12" font-weight="800" text-anchor="end">${pts[pts.length-1].y.toFixed(1).replace('.0','')} ${unit}</text></svg>`;
}

/* ═══ HOY ═══ */
function dots(v){return v?v.types.slice(0,3).map(t=>`<i style="--c:${(TYPES.find(x=>x.id===t)||{}).c}"></i>`).join(''):''}
function typesGrid(d){const v=peek(d)||{types:[]};return`<div class="types">${TYPES.map(t=>`<button class="type ${v.types.includes(t.id)?'on':''}" style="--c:${t.c}" data-act="type" data-id="${t.id}" data-d="${d}"><span class="e">${ei(t.e)}</span>${t.n}</button>`).join('')}</div>`}
function lastText(id,d){const h=hist(id,d);if(!h.length)return'';const l=h[h.length-1];return'Última vez ('+fshort(l.d)+'): '+l.sets.map(s=>(num(s.kg)||'–')+'×'+s.reps).join(' · ')}
function suggest(id,d){const h=hist(id,d);if(!h.length)return'';const l=h[h.length-1];const k=Math.max(...l.sets.map(s=>num(s.kg)));if(k>0&&l.sets.every(s=>num(s.reps)>=12))return'Hiciste 12+ reps: prueba a subir a '+(k+2.5)+' kg';return''}
function cardEx(e,i,d){
  const ex=EX(e.id);if(!ex)return'';
  const done=e.sets.length&&e.sets.every(s=>s.done);
  const lt=lastText(e.id,d),sg=suggest(e.id,d);
  const prev=(hist(e.id,d).slice(-1)[0]||{sets:[]}).sets;
  const rows=e.sets.map((s,j)=>{const p=prev[j]||prev[prev.length-1]||{};return`<div class="set ${s.done?'done':''} ${s.pr?'pr':''}" data-i="${i}" data-j="${j}"><span class="n">${s.pr?ei('trofeo',15):j+1}</span><input inputmode="decimal" data-f="kg" value="${esc(s.kg)}" placeholder="${p.kg||'kg'}" aria-label="Peso serie ${j+1}"><span class="x">×</span><input inputmode="numeric" data-f="reps" value="${esc(s.reps)}" placeholder="${p.reps||'reps'}" aria-label="Repeticiones serie ${j+1}"><button class="ck" data-act="ck" aria-label="Marcar serie ${j+1}">✓</button></div>`}).join('');
  return`<div class="card ex" style="--gc:${gcol(ex.g)}"><div class="ex-h"><div class="fig" data-ex="${esc(ex.id)}" data-act="detail" data-id="${esc(ex.id)}"></div>
  <div class="grow" data-act="detail" data-id="${esc(ex.id)}"><h3>${esc(ex.n)}</h3><div class="m">${musText(ex)}</div>${lt?`<div class="last">${lt}</div>`:''}${sg?`<div class="last" style="color:var(--color-principal)">${sg}</div>`:''}</div>
  ${done?'<span class="badge">HECHO</span>':''}<button class="icon-btn" data-act="exmenu" data-i="${i}" aria-label="Opciones">⋯</button></div>
  <div class="sets"><div class="sethd"><span>Serie</span><span>Peso (kg)</span><span></span><span>Reps</span><span>${ei("ok",14)}</span></div>${rows}</div>
  <div class="ex-f"><button class="btn sm grow" data-act="addset" data-i="${i}">＋ Serie</button><button class="btn sm grow" data-act="rmset" data-i="${i}">－ Serie</button></div></div>`}
function vHoy(){
  const d=U.sel,v=peek(d)||{types:[],ex:[],supp:{},act:{},note:''},isT=d===TODAY();
  const[dn,dt]=setsDone(v),pct=dt?Math.round(dn/dt*100):0,rest=v.types.includes('descanso');
  const h=new Date().getHours(),greet=h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches';
  const wk=mon(d);let strip='';for(let i=0;i<7;i++){const dd=addDays(wk,i),vv=peek(dd);strip+=`<button class="wd ${dd===d?'sel':''} ${dd===TODAY()?'today':''}" data-act="sel" data-d="${dd}"><span class="l">${'LMXJVSD'[i]}</span><span class="n">${pd(dd).getDate()}</span><span class="dots">${dots(vv)}</span></button>`}
  let wkAct=0,wkVol=0;for(let i=0;i<7;i++){const vv=peek(addDays(wk,i));if(active(vv))wkAct++;if(vv)wkVol+=volume(vv)}
  const hasAct=v.types.some(t=>ACT.includes(t));
  const A=v.act||{},km=num(A.km),mn=num(A.min);
  const pace=km>0&&mn>0?(mn/km):0,paceTxt=pace?(Math.floor(pace)+':'+pad(Math.round((pace%1)*60))+' min/km · '+(km/(mn/60)).toFixed(1)+' km/h'):'';
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.navigator.standalone&&!S.cfg.noInstall;
  let o=`<div class="hdr"><div><div class="sub">${fdate(d)}${isT?' · hoy':''}</div><h1>${isT?greet+(S.cfg.name?', '+esc(S.cfg.name):''):cap(DIAS[pd(d).getDay()])+' '+pd(d).getDate()}</h1></div><div class="ring" style="--p:${rest&&!dt?100:pct}"><i>${rest&&!dt?'😴':pct+'%'}</i></div></div>
  <div class="week"><button class="nav" data-act="wk" data-n="-7" aria-label="Semana anterior">‹</button>${strip}<button class="nav" data-act="wk" data-n="7" aria-label="Semana siguiente">›</button></div>
  <div class="stats"><div class="stat"><b>${streak()}<span style="color:#ff9f1c;vertical-align:-3px;margin-left:3px">${ei("llama",20)}</span></b><span>Racha (días)</span></div><div class="stat"><b>${wkAct}/7</b><span>Días activos</span></div><div class="stat"><b>${fmt(wkVol)}</b><span>Kg movidos semana</span></div></div>`;
  if(ios)o+=`<div class="card install" style="margin-top:12px"><div class="row"><div class="grow"><b>Instálala en tu iPhone</b><div class="hint">Safari → botón Compartir → «Añadir a pantalla de inicio». Se abrirá como una app y sin barras.</div></div><button class="icon-btn" data-act="hideinstall" aria-label="Cerrar">✕</button></div></div>`;
  o+=`<div class="sec">Tipo de día</div>${typesGrid(d)}`;
  if(hasAct){const t=v.types.includes('montana');o+=`<div class="card" style="margin-top:12px"><div class="field"><label>Distancia (km)<input inputmode="decimal" data-af="km" value="${esc(A.km||'')}" placeholder="0"></label><label>Tiempo (min)<input inputmode="numeric" data-af="min" value="${esc(A.min||'')}" placeholder="0"></label>${t?`<label>Desnivel (m)<input inputmode="numeric" data-af="desn" value="${esc(A.desn||'')}" placeholder="0"></label>`:''}</div>${paceTxt?`<div class="hint" style="margin-top:8px">⏱ ${paceTxt}</div>`:''}</div>`}
  o+=`<div class="sec"><span>Suplementos</span><span>${suppOn().filter(s=>v.supp[s.id]).length}/${suppOn().length}</span></div><div class="supps">${suppOn().map(s=>`<button class="supp ${v.supp[s.id]?'on':''}" data-act="supp" data-id="${s.id}"><span class="e">${ei(s.e)}</span><span>${esc(s.n)}</span><span class="tick">${ei("ok",13)}</span></button>`).join('')||'<div class="hint">Activa tus suplementos en Ajustes.</div>'}</div>`;
  o+=`<div class="sec"><span>Entrenamiento</span><span>${dt?dn+'/'+dt+' series':''}</span></div>`;
  if(v.ex.length)o+=v.ex.map((e,i)=>cardEx(e,i,d)).join('');
  else o+=`<div class="card empty"><b>${rest?'Hoy toca descansar 😴':'Aún no hay ejercicios'}</b>${rest?'Dormir bien y comer bien también es entrenar.':'Añade ejercicios desde la biblioteca o usa una rutina.'}</div>`;
  o+=`<div class="row" style="gap:10px;margin-top:4px"><button class="btn pri grow" data-act="addex">＋ Añadir ejercicios</button><button class="btn" data-act="routines">Rutinas</button></div>
  <div class="sec">Notas del día</div><textarea data-nf placeholder="Sensaciones, sueño, molestias…">${esc(v.note||'')}</textarea>`;
  return o}

/* ═══ CALENDARIO ═══ */

  <div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="icon-btn" data-act="calnav" data-n="-1" aria-label="Mes anterior">‹</button><b style="font-size:19px">${cap(MES[first.getMonth()])} ${first.getFullYear()}</b><button class="icon-btn" data-act="calnav" data-n="1" aria-label="Mes siguiente">›</button></div>

  <div class="sec">${fdate(U.sel)}</div>

  <div style="margin-top:12px" class="hint">${v.ex.length?`<b style="color:var(--color-texto)">${v.ex.length} ejercicios</b> · ${dn}/${dt} series hechas · ${fmt(volume(v))} kg<br>${v.ex.map(e=>esc((EX(e.id)||{}).n||'')).join(', ')}`:'Sin ejercicios planificados.'}${sup?`<br>Suplementos: ${sup}`:''}</div>
  <div class="row" style="gap:10px;margin-top:12px"><button class="btn pri grow" data-act="goto" data-d="${U.sel}">Abrir día</button><button class="btn grow" data-act="addex">＋ Ejercicios</button></div></div>`}

/* ═══ BIBLIOTECA ═══ */
function vLib(){
  const fav=U.g==='fav',list=allEx().filter(e=>(U.g==='all'||fav&&S.fav.includes(e.id)||e.g===U.g)&&(!U.eq||e.eq===U.eq)&&(!U.q||(e.n+' '+musText(e)+' '+GRP[e.g].n).toLowerCase().includes(U.q.toLowerCase())));
  const tiles=`<button class="gtile ${U.g==='all'?'on':''}" style="--c:var(--color-principal)" data-act="gsel" data-g="all"><div style="height:70px;display:grid;place-items:center;font-size:34px">∞</div>Todos</button><button class="gtile ${fav?'on':''}" style="--c:#ffcf33" data-act="gsel" data-g="fav"><div style="height:70px;display:grid;place-items:center;font-size:34px">★</div>Favoritos</button>`
   +Object.keys(GRP).map(k=>`<button class="gtile ${U.g===k?'on':''}" style="--c:${GRP[k].c}" data-act="gsel" data-g="${k}">${silSVG(k)}${GRP[k].n}</button>`).join('');

  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="q" value="${esc(U.q)}" placeholder="Buscar ejercicio o músculo" autocomplete="off"></div>

function updPick(){const b=$('#pickbar'),n=U.picked.size;if(U.pick&&n){b.style.display='flex';b.innerHTML=`<span class="grow">${n} seleccionado${n>1?'s':''} → ${fshort(U.sel)}</span><button class="btn sm" style="background:#0a0c10;color:#fff" data-act="pickadd">Añadir</button><button class="btn sm" style="background:#0002;border:0" data-act="pickday">Otro día</button>`}else b.style.display='none'}

/* ═══ PROGRESO ═══ */
function vProg(){
  const wk=mon(TODAY());let bars='',tot=0,mx=1;const ws=[];
  for(let i=7;i>=0;i--){const w=addDays(wk,-7*i);let vol=0;for(let k=0;k<7;k++){const v=peek(addDays(w,k));if(v)vol+=volume(v)}ws.push([w,vol]);mx=Math.max(mx,vol)}
  bars=ws.map(([w,vol])=>`<div><span>${vol?fmt(vol):''}</span><b style="height:${Math.max(3,vol/mx*80)}%"></b><span>${pd(w).getDate()}/${pd(w).getMonth()+1}</span></div>`).join('');
  let sess=0,sets=0,prs=0;for(const d in S.days){const v=S.days[d];const[n]=setsDone(v);if(n>0)sess++;sets+=n;for(const e of v.ex)for(const s of e.sets)if(s.pr)prs++}
  const withH=allEx().filter(e=>hist(e.id).length);if(!U.pe||!withH.find(e=>e.id===U.pe))U.pe=withH[0]?withH[0].id:'';
  let exBlock='<div class="hint">Cuando marques series como hechas con su peso y repeticiones, aquí verás tu evolución por ejercicio.</div>';
  if(U.pe){const ex=EX(U.pe),h=hist(U.pe),b=bestOf(h);
    const pts=h.map(x=>({d:x.d,y:U.pm==='w'?Math.max(...x.sets.map(s=>num(s.kg))):Math.max(...x.sets.map(s=>e1(num(s.kg),num(s.reps))))}));
    exBlock=`<select id="pe">${withH.map(e=>`<option value="${esc(e.id)}" ${e.id===U.pe?'selected':''}>${esc(e.n)}</option>`).join('')}</select>
    <div class="seg" style="margin:10px 0"><button class="${U.pm==='w'?'on':''}" data-act="pm" data-m="w">Peso máximo</button><button class="${U.pm==='r'?'on':''}" data-act="pm" data-m="r">1RM estimado</button></div>${lineChart(pts,gcol(ex.g),'kg')}
    <div class="stats" style="margin-top:8px"><div class="stat"><b>${b.kg||'–'}</b><span>Récord (kg)</span></div><div class="stat"><b>${b.rm?b.rm.toFixed(0):'–'}</b><span>1RM est.</span></div><div class="stat"><b>${h.length}</b><span>Sesiones</span></div></div>
    <div style="margin-top:8px">${h.slice(-5).reverse().map(x=>`<div class="rec"><b style="width:56px">${fshort(x.d)}</b><span class="grow small muted">${x.sets.map(s=>(num(s.kg)||'–')+'×'+s.reps).join('  ·  ')}</span></div>`).join('')}</div>`}
  const recs=withH.map(e=>({e,b:bestOf(hist(e.id))})).filter(x=>x.b.kg>0).sort((a,b)=>b.b.rm-a.b.rm).slice(0,6);
  const bd=S.body.slice().sort((a,b)=>a.d<b.d?-1:1),lastB=bd[bd.length-1];
  const d30=[];for(let i=0;i<30;i++)d30.push(peek(addDays(TODAY(),-i)));
  const sp=suppOn().map(s=>{const n=d30.filter(v=>v&&v.supp[s.id]).length;return`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:5px"><span class="row" style="gap:7px;display:inline-flex">${ei(s.e,16)} ${esc(s.n)}</span><b>${n}/30</b></div><div class="pbar"><i style="width:${n/30*100}%;--c:var(--ok)"></i></div></div>`}).join('');
  const mo=TODAY().slice(0,7),mm={correr:0,montana:0,bici:0,nadar:0,desn:0,dias:0};for(const d in S.days)if(d.startsWith(mo)){const v=S.days[d];if(active(v))mm.dias++;for(const t of ACT)if(v.types.includes(t))mm[t]+=num(v.act.km);if(v.types.includes('montana'))mm.desn+=num(v.act.desn)}
  return`<div class="hdr"><div><div class="sub">Tu evolución</div><h1>Progreso</h1></div></div>
  <div class="stats"><div class="stat"><b>${sess}</b><span>Entrenos</span></div><div class="stat"><b>${sets}</b><span>Series hechas</span></div><div class="stat"><b>${prs}<span style="color:#e6b422;vertical-align:-3px;margin-left:3px">${ei("trofeo",20)}</span></b><span>Récords</span></div></div>
  <div class="sec">Volumen semanal (kg)</div><div class="card"><div class="bars">${bars}</div></div>
  <div class="sec">Progresión por ejercicio</div><div class="card">${exBlock}</div>
  ${recs.length?`<div class="sec">Mejores marcas</div><div class="card">${recs.map(x=>`<div class="rec" data-act="detail" data-id="${esc(x.e.id)}"><div class="grow"><b>${esc(x.e.n)}</b><div class="small muted">1RM est. ${x.b.rm.toFixed(0)} kg</div></div><b style="color:${gcol(x.e.g)};font-size:20px">${x.b.kg} kg</b></div>`).join('')}</div>`:''}
  <div class="sec">Actividad este mes</div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>${mm.correr.toFixed(1).replace('.0','')} km</b><span>🏃 Correr</span></div><div class="stat"><b>${mm.montana.toFixed(1).replace('.0','')} km · ${Math.round(mm.desn)} m</b><span>⛰️ Montaña (km · desnivel)</span></div><div class="stat"><b>${mm.bici.toFixed(1).replace('.0','')} km</b><span>🚴 Bici</span></div><div class="stat"><b>${mm.dias}</b><span>Días activos</span></div></div>
  <div class="sec">Peso corporal</div><div class="card">${lineChart(bd.slice(-20).map(x=>({d:x.d,y:x.kg})),'#22d3ee','kg')}<div class="row" style="margin-top:10px"><input inputmode="decimal" id="bw" placeholder="${lastB?lastB.kg+' kg':'Peso de hoy (kg)'}"><button class="btn pri" data-act="bwlog">Guardar</button></div></div>
  <div class="sec">Suplementos · últimos 30 días</div><div class="card">${sp||'<div class="hint">Activa suplementos en Ajustes.</div>'}</div>`}

/* ═══ AJUSTES ═══ */
function vMas(){
  return`<div class="hdr"><div><div class="sub">Personaliza</div><h1>Ajustes</h1></div></div>
  <div class="card"><label class="small muted" for="nm">Tu nombre</label><input id="nm" value="${esc(S.cfg.name)}" placeholder="Para el saludo"></div>
  <div class="sec">Temporizador de descanso</div><div class="card"><div class="seg">${[45,60,90,120,180].map(x=>`<button class="${S.cfg.rest===x?'on':''}" data-act="restcfg" data-s="${x}">${x<120?x+'s':x/60+'m'}</button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><span class="grow">Iniciar al marcar una serie</span><button class="switch ${S.cfg.auto?'on':''}" data-act="autorest" aria-label="Automático"></button></div></div>
  <div class="sec">Suplementos</div><div class="card">${S.supps.map(s=>`<div class="row" style="padding:7px 0"><span style="display:inline-flex;width:24px;justify-content:center">${ei(s.e,20)}</span><span class="grow">${esc(s.n)}</span><button class="switch ${s.on?'on':''}" data-act="supcfg" data-id="${s.id}" aria-label="${esc(s.n)}"></button></div>`).join('')}<button class="btn blk" style="margin-top:8px" data-act="newsupp">＋ Añadir suplemento</button></div>
  <div class="sec">Mis rutinas</div><div class="card">${S.routines.length?S.routines.map((r,i)=>`<div class="row" style="padding:7px 0"><div class="grow"><b>${esc(r.n)}</b><div class="small muted">${r.ex.length} ejercicios</div></div><button class="icon-btn" data-act="routdel" data-i="${i}" aria-label="Borrar">🗑</button></div>`).join(''):'<div class="hint">Guarda un día como rutina desde «Rutinas» en la pantalla Hoy.</div>'}</div>
  ${S.custom.length?`<div class="sec">Mis ejercicios</div><div class="card">${S.custom.map(c=>`<div class="row" style="padding:7px 0"><div class="grow"><b>${esc(c.n)}</b><div class="small muted">${GRP[c.g].n} · ${esc(c.eq)}</div></div><button class="icon-btn" data-act="cexdel" data-id="${c.id}" aria-label="Borrar">🗑</button></div>`).join('')}</div>`:''}
  <div class="sec">Copia de seguridad</div><div class="card"><div class="hint" style="margin-bottom:10px">Tus datos viven sólo en este dispositivo. Haz copias de vez en cuando (y antes de cambiar de móvil o reinstalar).</div>
  <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn grow" data-act="export">${ei("bajar",16)} Exportar</button><button class="btn grow" data-act="copyjson">${ei("copiar",16)} Copiar</button><button class="btn grow" data-act="import">⬆ Importar</button></div><input type="file" id="file" accept="application/json,.json" style="display:none"></div>
  <div class="sec">Instalar en iPhone</div><div class="card hint">1. Abre esta página en <b>Safari</b>.<br>2. Toca <b>Compartir</b> (cuadrado con flecha) → <b>Añadir a pantalla de inicio</b>.<br>3. Ábrela desde el icono: funcionará a pantalla completa y sin conexión.<br><br><b>Importante:</b> los datos de Safari y los de la app instalada son independientes; instala primero y usa siempre el icono.</div>
  <button class="btn danger blk" style="margin-top:14px" data-act="reset">Borrar todos los datos</button><p class="hint" style="text-align:center;margin-top:16px">Forja · v1.0 · Hecho para entrenar</p>`}

/* ═══ render ═══ */
const VIEWS={hoy:vHoy,cal:vCal,lib:vLib,prog:vProg,mas:vMas};
function render(keepScroll){
  const el=$('#v-'+U.tab),sc=el.scrollTop,ae=document.activeElement;
  FigMgr.clear();el.innerHTML=VIEWS[U.tab]();
  $$('.view').forEach(v=>v.classList.toggle('on',v===el));
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t[0]===U.tab?'on':''}" data-act="tab" data-t="${t[0]}"><svg viewBox="0 0 24 24">${ICON[t[0]]}</svg>${t[1]}</button>`).join('');
  mountFigs(el);if(keepScroll)el.scrollTop=sc;updPick();
}
function go(t){U.tab=t;if(t!=='lib'){U.pick=false;U.picked.clear()}render();$('#v-'+t).scrollTop=0}

/* ═══ acciones ═══ */
function addEx(id,date,quiet){
  const v=D(date);if(v.ex.some(e=>e.id===id)){if(!quiet)toast('Ya está en ese día');return false}
  const h=hist(id,date),l=h.length?h[h.length-1].sets:null;
  v.ex.push({id,sets:l?l.map(s=>({kg:s.kg,reps:s.reps,done:false})):[0,1,2].map(()=>({kg:'',reps:'10',done:false}))});
  v.types=v.types.filter(t=>t!=='descanso');if(!v.types.includes('fuerza'))v.types.unshift('fuerza');save();return true}
function addMany(ids,date){let n=0;for(const id of ids)if(addEx(id,date,true))n++;toast(n?`${n} ejercicio${n>1?'s':''} añadido${n>1?'s':''} a ${n&&date===TODAY()?'hoy':fshort(date)}`:'Ya estaban en ese día')}
let rest=null,restI=0,actx;
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}}
function startRest(s){rest={end:Date.now()+s*1000};try{actx=actx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}drawRest();clearInterval(restI);restI=setInterval(tickRest,250)}
function drawRest(){const p=$('#rest');if(!rest){p.classList.remove('on');return}p.classList.add('on');p.innerHTML=`<span style="display:inline-flex">${ei("reloj",22)}</span><span class="t" id="rt"></span><span class="grow"></span><button class="btn sm" data-act="restadj" data-n="-15">−15</button><button class="btn sm" data-act="restadj" data-n="15">+15</button><button class="btn sm pri" data-act="restskip">Saltar</button>`;tickRest()}
function tickRest(){if(!rest)return;const l=Math.ceil((rest.end-Date.now())/1000);if(l<=0){rest=null;clearInterval(restI);drawRest();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('¡Descanso terminado! A por la siguiente serie 💪');return}const t=$('#rt');if(t)t.textContent=Math.floor(l/60)+':'+pad(l%60)}

function onClick(ev){
  const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,d=t.dataset.d,i=+t.dataset.i;
  switch(a){
  case'tab':go(t.dataset.t);break;
  case'sel':U.sel=d;render(true);break;
  case'wk':U.sel=addDays(U.sel,+t.dataset.n);render(true);break;
  case'goto':U.sel=d;go('hoy');break;
  case'type':{const v=D(d);const k=v.types.indexOf(id);if(k>=0)v.types.splice(k,1);else if(id==='descanso')v.types=['descanso'];else{v.types=v.types.filter(x=>x!=='descanso');v.types.push(id)}save();render(true);break}
  case'supp':{const v=D(U.sel);v.supp[id]=!v.supp[id];save();render(true);break}
  case'ck':{const row=t.closest('.set'),ei=+row.dataset.i,j=+row.dataset.j,v=D(U.sel),s=v.ex[ei].sets[j];s.done=!s.done;
    if(s.done){const k=num(s.kg),r=num(s.reps),h=hist(v.ex[ei].id,U.sel),pb=bestOf(h).rm;if(k>0&&r>0&&pb>0&&e1(k,r)>pb*1.001){s.pr=true;toast('Nuevo récord personal')}else delete s.pr;
      if(!v.types.length||(!v.types.includes('fuerza')&&!v.types.includes('descanso')))v.types.unshift('fuerza');v.types=v.types.filter(x=>x!=='descanso');
      if(S.cfg.auto)startRest(S.cfg.rest)}else delete s.pr;
    save();render(true);break}
  case'addset':{const e=D(U.sel).ex[i],l=e.sets[e.sets.length-1]||{};e.sets.push({kg:l.kg||'',reps:l.reps||'10',done:false});save();render(true);break}
  case'rmset':{const e=D(U.sel).ex[i];if(e.sets.length>1)e.sets.pop();save();render(true);break}
  case'exmenu':{const v=D(U.sel),e=v.ex[i],ex=EX(e.id);sheet(`<h2>${esc(ex.n)}</h2><div style="display:grid;gap:8px"><button class="btn blk" data-act="detail" data-id="${esc(ex.id)}">Ver técnica y progreso</button><button class="btn blk" data-act="exup" data-i="${i}">↑ Subir</button><button class="btn blk" data-act="exdn" data-i="${i}">↓ Bajar</button><button class="btn blk danger" data-act="exdel" data-i="${i}">Quitar del día</button></div>`);break}
  case'exup':case'exdn':{const v=D(U.sel),j=a==='exup'?i-1:i+1;if(j>=0&&j<v.ex.length){[v.ex[i],v.ex[j]]=[v.ex[j],v.ex[i]];save()}closeSheet();render(true);break}
  case'exdel':{D(U.sel).ex.splice(i,1);save();closeSheet();render(true);break}
  case'addex':U.pick=true;U.picked.clear();U.tab='lib';render();$('#v-lib').scrollTop=0;toast('Marca los ejercicios y pulsa Añadir');break;
  case'pickmode':U.pick=!U.pick;U.picked.clear();render(true);break;
  case'toggle':U.picked.has(id)?U.picked.delete(id):U.picked.add(id);render(true);break;
  case'pickadd':{addMany([...U.picked],U.sel);U.pick=false;U.picked.clear();U.tab='hoy';render();break}
  case'pickday':sheet(`<h2>¿Para qué día?</h2><input type="date" id="dsel" value="${U.sel}"><button class="btn pri blk" style="margin-top:12px" data-act="pickgo">Añadir</button>`);break;
  case'pickgo':{const dd=$('#dsel').value;if(!dd)return;addMany([...U.picked],dd);U.sel=dd;U.pick=false;U.picked.clear();closeSheet();U.tab='hoy';render();break}
  case'gsel':U.g=t.dataset.g;render(true);break;
  case'eqsel':U.eq=t.dataset.e;render(true);break;
  case'fav':{const k=S.fav.indexOf(id);k>=0?S.fav.splice(k,1):S.fav.push(id);save();render(true);break}
  case'detail':openDetail(id);break;
  case'add':if(addEx(id,U.sel)){toast('Añadido a '+(U.sel===TODAY()?'hoy':fshort(U.sel)));closeSheet();U.tab==='hoy'&&render(true)}break;
  case'addon':sheet(`<h2>¿Para qué día?</h2><input type="date" id="dsel" value="${U.sel}"><button class="btn pri blk" style="margin-top:12px" data-act="addongo" data-id="${esc(id)}">Añadir</button>`);break;
  case'addongo':{const dd=$('#dsel').value;if(dd&&addEx(id,dd)){U.sel=dd;toast('Añadido a '+fshort(dd));closeSheet();render(true)}break}
  case'calnav':{const n=+t.dataset.n;if(!n)U.cm=TODAY().slice(0,8)+'01',U.sel=TODAY();else{const x=pd(U.cm);x.setMonth(x.getMonth()+n);U.cm=iso(x)}render(true);break}
  case'calsel':U.sel=d;render(true);break;
  case'routines':openRoutines();break;
  case'routgo':{const r=ALLR()[i];addMany(r.ex.filter(EX),U.sel);closeSheet();render(true);break}
  case'routsave':{const v=peek(U.sel);const nm=($('#rn').value||'').trim();if(!nm||!v||!v.ex.length)return toast('Pon un nombre y añade ejercicios al día');S.routines.push({n:nm,ex:v.ex.map(e=>e.id)});save();toast('Rutina guardada');closeSheet();break}
  case'copylast':{const ds=Object.keys(S.days).filter(x=>x<U.sel&&S.days[x].ex.length).sort();if(!ds.length)return toast('No hay entrenos anteriores');const src=S.days[ds[ds.length-1]];addMany(src.ex.map(e=>e.id),U.sel);closeSheet();render(true);break}
  case'routdel':S.routines.splice(i,1);save();render(true);break;
  case'cexdel':if(confirm('¿Borrar este ejercicio?')){S.custom=S.custom.filter(c=>c.id!==id);save();render(true)}break;
  case'hideinstall':S.cfg.noInstall=true;save();render(true);break;
  case'pm':U.pm=t.dataset.m;render(true);break;
  case'bwlog':{const k=num($('#bw').value);if(!k)return toast('Escribe tu peso');const x=S.body.find(b=>b.d===TODAY());x?x.kg=k:S.body.push({d:TODAY(),kg:k});save();toast('Peso guardado');render(true);break}
  case'restcfg':S.cfg.rest=+t.dataset.s;save();render(true);break;
  case'autorest':S.cfg.auto=!S.cfg.auto;save();render(true);break;
  case'restadj':if(rest){rest.end+=+t.dataset.n*1000;tickRest()}break;
  case'restskip':rest=null;clearInterval(restI);drawRest();break;
  case'supcfg':{const s=S.supps.find(x=>x.id===id);s.on=!s.on;save();render(true);break}
  case'newsupp':sheet(`<h2>Nuevo suplemento</h2><div class="field"><label style="flex:none;width:80px">Emoji<input id="se" value="💊" maxlength="2"></label><label>Nombre<input id="sn" placeholder="p. ej. Ashwagandha"></label></div><button class="btn pri blk" style="margin-top:12px" data-act="suppsave">Añadir</button>`);break;
  case'suppsave':{const n=($('#sn').value||'').trim();if(!n)return;S.supps.push({id:'s'+Date.now(),n,e:$('#se').value||'pastilla',on:true});save();closeSheet();render(true);break}
  case'newex':sheet(`<h2>Crear ejercicio propio</h2><label class="small muted">Nombre</label><input id="cn" placeholder="p. ej. Remo con banda"><label class="small muted" style="display:block;margin-top:10px">Grupo muscular</label><select id="cg">${Object.keys(GRP).map(k=>`<option value="${k}">${GRP[k].n}</option>`).join('')}</select><label class="small muted" style="display:block;margin-top:10px">Material</label><select id="ce">${EQS.concat(['Banda']).map(e=>`<option>${e}</option>`).join('')}</select><button class="btn pri blk" style="margin-top:14px" data-act="cexsave">Crear</button>`);break;
  case'cexsave':{const n=($('#cn').value||'').trim();if(!n)return toast('Ponle un nombre');const g=$('#cg').value;S.custom.push({id:'c'+Date.now(),n,g,eq:$('#ce').value,a:null,m:[MUS0[g]],imp:'none',lv:'p',steps:[],tip:'Ejercicio personalizado.'});save();closeSheet();U.g=g;render(true);toast('Ejercicio creado');break}
  case'export':doExport();break;
  case'copyjson':copyText(JSON.stringify(S)).then(ok=>toast(ok?'Copia en el portapapeles':'No se pudo copiar'));break;
  case'import':$('#file').click();break;
  case'reset':if(confirm('Se borrarán TODOS tus datos de este dispositivo. ¿Seguro?')&&confirm('Última confirmación: esta acción no se puede deshacer.')){localStorage.removeItem(KEY);location.reload()}break;
  }
}
const ALLR=()=>ROUT0.concat(S.routines);
function openRoutines(){
  const v=peek(U.sel);
  sheet(`<h2>Rutinas</h2><div style="display:grid;gap:8px">${ALLR().map((r,i)=>`<button class="btn blk" style="justify-content:space-between;text-align:left" data-act="routgo" data-i="${i}"><span>${esc(r.n)}</span><span class="muted small">${r.ex.length} ej.</span></button>`).join('')}</div>
  <div class="sec">Atajos</div><button class="btn blk" data-act="copylast">↺ Repetir el último entreno</button>
  ${v&&v.ex.length?`<div class="sec">Guardar este día como rutina</div><div class="row"><input id="rn" placeholder="Nombre de la rutina"><button class="btn pri" data-act="routsave">Guardar</button></div>`:''}`)}
function openDetail(id){
  const ex=EX(id);if(!ex)return;const h=hist(id),b=bestOf(h),pts=h.map(x=>({d:x.d,y:Math.max(...x.sets.map(s=>e1(num(s.kg),num(s.reps))))}));
  const steps=(ex.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  sheet(`<div class="figw" style="position:relative;--gc:${gcol(ex.g)}"><div class="fig" data-ex="${esc(ex.id)}" data-still=".25" style="height:250px;border-radius:22px"></div><span class="tag" style="position:absolute;left:12px;top:12px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#000a;color:${gcol(ex.g)}">${GRP[ex.g].n}</span><button class="star ${S.fav.includes(ex.id)?'on':''}" style="position:absolute;right:8px;top:6px;font-size:28px" data-act="fav2" data-id="${esc(ex.id)}" aria-label="Favorito">★</button></div>
  <h2 style="margin-top:14px">${esc(ex.n)}</h2><div class="chips">${musChips(ex)}<span class="chip" style="padding:4px 9px;font-size:12px">${esc(ex.eq)}</span>${ex.lv?`<span class="chip" style="padding:4px 9px;font-size:12px">${LVL[ex.lv]}</span>`:''}</div>
  ${steps?`<div class="sec">Cómo hacerlo</div><ol class="steps">${steps}</ol>`:''}${ex.tip?`<div class="tip"><span style="display:inline-flex;vertical-align:-4px;margin-right:6px">${ei("bombilla",18)}</span>${esc(ex.tip)}</div>`:''}
  <div class="sec">Tu progreso</div>${h.length?`<div class="stats"><div class="stat"><b>${b.kg||'–'}</b><span>Récord kg</span></div><div class="stat"><b>${b.rm?b.rm.toFixed(0):'–'}</b><span>1RM est.</span></div><div class="stat"><b>${h.length}</b><span>Sesiones</span></div></div>${lineChart(pts,gcol(ex.g),'kg')}`:'<div class="hint">Aún no has registrado series de este ejercicio.</div>'}
  <div class="row" style="gap:10px;margin-top:16px"><button class="btn pri grow" data-act="add" data-id="${esc(ex.id)}">＋ A ${U.sel===TODAY()?'hoy':fshort(U.sel)}</button><button class="btn grow" data-act="addon" data-id="${esc(ex.id)}">Otro día…</button></div>`)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}}
async function doExport(){
  const json=JSON.stringify(S,null,1),name='forja-'+TODAY()+'.json';
  try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Copia de Forja'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Copia exportada')}

/* ── eventos ── */
document.addEventListener('click',ev=>{
  if(ev.target.closest('#ov')&&!ev.target.closest('#sheet')){closeSheet();return}
  const t=ev.target.closest('[data-act="fav2"]');if(t){const id=t.dataset.id,k=S.fav.indexOf(id);k>=0?S.fav.splice(k,1):S.fav.push(id);t.classList.toggle('on',k<0);save();favDirty=true;return}
  onClick(ev)});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.matches('.set input')){const row=t.closest('.set'),s=D(U.sel).ex[+row.dataset.i].sets[+row.dataset.j];s[t.dataset.f]=t.value.replace(',','.');save()}
  else if(t.dataset.af){D(U.sel).act[t.dataset.af]=t.value.replace(',','.');save()}
  else if(t.matches('[data-nf]')){D(U.sel).note=t.value;save()}
  else if(t.id==='q'){U.q=t.value;const pos=t.selectionStart;clearTimeout(U.qt);U.qt=setTimeout(()=>{render(true);const q=$('#q');q.focus();q.setSelectionRange(pos,pos)},160)}
  else if(t.id==='nm'){S.cfg.name=t.value;save()}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='pe'){U.pe=t.value;render(true)}
  else if(t.dataset.af){render(true)}
  else if(t.id==='file'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.days!=='object')throw 0;if(confirm('Se reemplazarán los datos actuales por los de la copia. ¿Continuar?')){S=Object.assign({days:{},supps:DEFSUPP,routines:[],fav:[],custom:[],body:[],cfg:{}},j);save();toast('Datos restaurados');setTimeout(()=>location.reload(),600)}}catch(e){toast('Archivo no válido')}};r.readAsText(t.files[0])}});
/* pull: deslizar para cambiar de día en Hoy */
let tx=null;$('#v-hoy').addEventListener('touchstart',e=>{tx=e.target.closest('input,textarea')?null:e.touches[0].clientX},{passive:true});
$('#v-hoy').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>90){U.sel=addDays(U.sel,dx<0?1:-1);render(true)}},{passive:true});

/* ── icono táctil de iOS generado al vuelo (la app funciona aunque sea un único archivo) ── */
function appIcon(sz){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#c8ff5a');g.addColorStop(1,'#22d3ee');x.fillStyle=g;x.fillRect(0,0,sz,sz);
  x.fillStyle='#0a0c10';const u=sz/100,rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a*u,b*u,w*u,h*u,r*u):x.rect(a*u,b*u,w*u,h*u);x.fill()};
  rr(14,36,10,28,4);rr(24,28,10,44,4);rr(66,28,10,44,4);rr(76,36,10,28,4);rr(34,46,32,8,3);return c.toDataURL('image/png')}
try{$('#touchicon').href=appIcon(180)}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
PELite.mount({ storageKey: 'forja-pwa', hint: false });
</script>
